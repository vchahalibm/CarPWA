name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: for f in js/*.js sw.js desktop/main.js bridge/*.js tools/trainer/ui/*.js; do node --check "$f"; done
      - name: Phrase tests (voice commands)
        run: node tests/phrases.cjs
      - name: Syntax-check the trainer (Python)
        run: python3 -m py_compile tools/trainer/server.py tools/trainer/trainer/*.py tools/trainer/trainer/engines/*.py
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check service worker precache list
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('sw.js', 'utf8');
            const list = src.match(/const SHELL = \[([\s\S]*?)\]/)[1].match(/'([^']+)'/g).map(s => s.slice(1, -1));
            const missing = list.filter(f => f !== './' && !fs.existsSync(f));
            if (missing.length) { console.error('Missing precache files:', missing); process.exit(1); }
          "
