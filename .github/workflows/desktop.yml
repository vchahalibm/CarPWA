name: Desktop app

# Builds StudioGen for Mac (Apple silicon and Intel) from the same web files as the PWA (DriveGen), and publishes the signed
# update feed the app updates itself from (the release "updates": update.json + its Ed25519 signature, the web files, the
# zipped apps). Every run keeps the DMGs as a downloadable artifact; a tag like desktop-v0.6.0 also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'presenter.html', 'css/**', 'js/**', 'vendor/**', 'icons/**', 'samples/**', 'bridge/**',
            'desktop/**', 'tools/release/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'tools/release/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write # the "updates" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Web version (the update number the app compares)
        run: node tools/release/make-update.mjs version
        env:
          WEB_VERSION: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build the DMGs and zipped apps (ad-hoc signed)
        working-directory: desktop
        run: npm run dist
      - name: Pack and sign the update feed
        run: node tools/release/make-update.mjs pack update-out
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Publish the update feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f update-out/update.json.sig ]; then echo "No signing key (secret UPDATE_SIGNING_KEY): not publishing updates"; exit 0; fi
          gh release view updates >/dev/null 2>&1 || gh release create updates --title "StudioGen updates" --latest=false \
            --notes "The signed feed StudioGen updates itself from. To install StudioGen, download the DMG from a desktop-v* release or the latest Desktop app run."
          have=$(gh release view updates --json assets -q '.assets[].name')
          # Payload first, the manifest last, so an app never sees update.json before its files are there.
          for f in update-out/*; do n=$(basename "$f")
            case "$n" in update.json|update.json.sig) continue;; esac
            if [[ "$n" == web-vendor-* ]] && echo "$have" | grep -qx "$n"; then echo "unchanged: $n"; continue; fi
            gh release upload updates "$f" --clobber
          done
          gh release upload updates update-out/update.json update-out/update.json.sig --clobber
          keep=$(node tools/release/make-update.mjs keep update-out/update.json)
          for n in $have; do echo "$keep" | grep -qx "$n" || gh release delete-asset updates "$n" -y; done
      - uses: actions/upload-artifact@v4
        with:
          name: StudioGen-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StudioGen-mac
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.dmg'
          body: |
            StudioGen for Mac. Download the DMG for your Mac: **arm64** for Apple silicon (M1 and later), **x64** for Intel.
            The app isn't notarised: after dragging it to Applications, run `xattr -cr /Applications/StudioGen.app` once in Terminal (or right-click › Open).
            After that StudioGen updates itself (Settings › System › Updates, or the menu bar › Check for updates).
