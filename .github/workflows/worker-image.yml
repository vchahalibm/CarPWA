# The StudioGen Worker image (worker/Dockerfile, worker/README.md), published as ghcr.io/vchahalibm/studiogen-worker:
# :latest and the commit, for Macs with Apple silicon (OrbStack, arm64) and servers (amd64). StudioGen › Workers pulls it.
name: Worker image
on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'index.html', 'sw.js', 'manifest.webmanifest', 'bridge/**', 'labs/**', 'desktop/**', 'worker/**', 'vendor/**', 'icons/**', '.dockerignore', '.github/workflows/worker-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: worker-image, cancel-in-progress: true }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studiogen-worker:latest
            ghcr.io/${{ github.repository_owner }}/studiogen-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=StudioGen Worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
