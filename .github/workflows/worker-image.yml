# The NaoMuse Worker image (worker/Dockerfile, worker/README.md), published as ghcr.io/vchahalibm/studiogen-worker:
# :latest and the commit, for Macs with Apple silicon (OrbStack, arm64) and servers (amd64). NaoMuse › Workers pulls it.
name: Worker image
on:
  # Not on every change: the two-architecture build is slow, and the source repo is private (free minutes). With a new
  # desktop version, a change to worker/, a desktop-v* tag, or by hand.
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['worker/**', 'desktop/package.json', '.dockerignore', '.github/workflows/worker-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: worker-image, cancel-in-progress: true }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Minify the code that goes into the public image
        run: node tools/release/dist.mjs minify desktop
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/studiogen-worker:latest
            ghcr.io/${{ github.repository_owner }}/studiogen-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=NaoMuse Worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
