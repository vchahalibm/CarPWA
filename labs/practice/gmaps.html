<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Maps</title>
<style>
:root{--bg:#fff;--ink:#202124;--ink2:#5f6368;--line:#dadce0;--acc:#1a73e8;--ok:#188038;--warn:#c5221f;--map:#e8eaed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--ink:#e8eaed;--ink2:#9aa0a6;--line:#3c4043;--map:#2b2c2f}}
:root[data-theme="dark"]{--bg:#202124;--ink:#e8eaed;--ink2:#9aa0a6;--line:#3c4043;--map:#2b2c2f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 Roboto,-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:400px 1fr;height:100vh}
#pane{border-right:1px solid var(--line);overflow:auto}#pane header{padding:16px;border-bottom:1px solid var(--line)}
.fld{padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;color:var(--ink2)}
.trip{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.trip.selected{border-left:4px solid var(--acc)}
.dur{font-size:18px;font-weight:500}.dur.slow{color:var(--warn)}.dur.ok{color:var(--ok)}.dist{color:var(--ink2);float:right}
h1.via{font-size:15px;font-weight:500;margin:4px 0}.note{color:var(--ink2);font-size:13px}.warn{color:var(--warn);font-size:13px;margin-top:4px}.det{margin-top:8px;border:1px solid var(--line);background:none;color:var(--acc);border-radius:16px;padding:4px 12px;font:inherit;cursor:pointer}
#map{background:var(--map);display:grid;place-items:center;color:var(--ink2)}
@media (max-width:760px){body{grid-template-columns:1fr}#map{display:none}}
</style>
</head>
<body>
<div id="pane" role="main" aria-label="Directions"></div>
<div id="map" aria-label="Map">Map (practice)</div>
<script>
/* A made-up Google Maps directions page for practising map watchers (docs/maps-watchers.html), built like Google's: each
   route option is a block with id section-directions-trip-N and data-trip-index, its time in traffic, distance, “via” road,
   notes and warnings. Address as Google's: ?origin=LAT,LON&destination=NAME@LAT,LON (or LAT,LON).
   Also ?saddr=&daddr=&dirflg=dth (Google's older form, with avoid tolls t / highways h).
   ?search=petrol+pump&at=LAT,LON: a search list of places near there.
   Details lists a route's turns (folded, as Google's); a click on a turn moves the map there (the address's @lat,lon).
   ?routes=35:Outer Ring Rd,42:NH44:Accident reported,50:Old Madras Rd sets the routes (minutes:via:warning), kept in this
   browser per destination; ?reset forgets them. Without it, times come from the distance. */
const q = new URLSearchParams(location.search), K = 'practiceGmaps';
const parse = s => { const [n, ll] = String(s || '').includes('@') ? s.split('@') : ['', s]; const [lat, lon] = String(ll || '').split(',').map(Number); return { name: n || ll, lat, lon }; };
const from = parse(q.get('origin') || q.get('saddr')), to = parse(q.get('destination') || q.get('daddr')), flg = q.get('dirflg') || '', key = `${to.lat?.toFixed?.(3)},${to.lon?.toFixed?.(3)}`;
const all = JSON.parse(localStorage.getItem(K) || '{}'); if (q.has('reset')) { delete all[key]; if (q.get('reset') === 'all') for (const k in all) delete all[k]; }
if (q.get('routes')) all[key] = q.get('routes').split(',').map(x => { const [min, via, warn] = x.split(':'); return { min: +min, via: via || '', warn: warn || '' }; });
localStorage.setItem(K, JSON.stringify(all));
const R = 6371, rad = d => d * Math.PI / 180, hav = (a, b) => 2 * R * Math.asin(Math.sqrt(Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2));
const km0 = (from.lat && to.lat) ? hav(from, to) * 1.3 : 12;
const routes = all[key] || [{ min: Math.round(km0 * 2.2) + 3, via: 'Outer Ring Rd' }, { min: Math.round(km0 * 2.2) + 8, via: 'NH44' }, { min: Math.round(km0 * 2.4) + 12, via: 'Old Madras Rd' }];
const shown = routes.map((r, i) => ({ ...r, tolls: i === 1 })).filter(r => !(flg.includes('t') && r.tolls) && !(flg.includes('h') && /^NH|highway/i.test(r.via))); /* Google's avoid options (the older address form: dirflg t, h) */
const pane = document.getElementById('pane'); let sel = 0;
const fastest = Math.min(...shown.map(r => r.min)), dur = m => m >= 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m} min`;
function draw() {
pane.innerHTML = `<header><div class="fld">${from.lat ? `${from.lat.toFixed(4)}, ${from.lon.toFixed(4)}` : 'Your location'}</div><div class="fld">${to.name || 'Choose destination'}</div></header>
  ${flg.replace('d', '') ? `<div class="note" style="padding:8px 16px">Options: ${[flg.includes('t') && 'avoiding tolls', flg.includes('h') && 'avoiding highways'].filter(Boolean).join(', ')}</div>` : ''}
  ${shown.map((r, i) => `<div id="section-directions-trip-${i}" data-trip-index="${i}" class="trip ${i === sel ? 'selected' : ''}">
    <div class="dur ${r.min === fastest ? 'ok' : r.min - fastest > 5 ? 'slow' : ''}">${dur(r.min)}</div><div class="dist">${(km0 * (1 + i * 0.12)).toFixed(1)} km</div>
    <h1 class="via">via ${r.via}</h1><div class="note">${r.min === fastest ? 'Fastest route now due to traffic conditions' : r.min - fastest > 5 ? 'Heavier traffic than usual' : 'Typical traffic'}</div>
    ${r.warn ? `<div class="warn">${r.warn}</div>` : ''}${r.tolls ? '<div class="note">This route has tolls.</div>' : ''}${i === sel ? '<button class="det">Details</button>' : ''}</div>`).join('')}`;
pane.querySelectorAll('.trip').forEach((el, i) => el.onclick = e => { if (e.target.closest('.det')) return details(i); sel = i; draw(); });
map();
}
/* The map: each route a line from start to end, bent its own way; the selected one blue and on top (a card's map picture) */
function map() { const W = 600, H = 500, pts = k => { const b = (k - 1) * 120; return `60,440 ${200 + b},${300 - b / 2} ${380 + b / 2},${160 - b / 3} 540,60`; };
  document.getElementById('map').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="max-height:100vh"><rect width="${W}" height="${H}" fill="var(--map)"/>
    ${shown.map((r, k) => k === sel ? '' : `<polyline points="${pts(k)}" fill="none" stroke="#9aa0a6" stroke-width="8" stroke-linejoin="round"/>`).join('')}
    <polyline points="${pts(sel)}" fill="none" stroke="#1a73e8" stroke-width="10" stroke-linejoin="round"/>
    ${shown.map((r, k) => `<text x="${(200 + (k - 1) * 120) + 14}" y="${300 - (k - 1) * 60}" font-size="20" fill="${k === sel ? '#1a73e8' : '#5f6368'}" font-family="sans-serif">${r.min} min · ${r.via}</text>`).join('')}
    <circle cx="60" cy="440" r="10" fill="#fff" stroke="#202124" stroke-width="4"/><circle cx="540" cy="60" r="12" fill="#ea4335"/></svg>`; }
/* Details, as Google's: the route's turns in groups, each group's single turns folded away (in the page, not shown); a
   turn is [words, lat, lon] or words (placed along the way). Outer Ring Rd passes Silk Board junction without naming it. */
const TURNS = { 'Outer Ring Rd': [['Take 80 Feet Rd to Outer Ring Rd', ['Head south on 100 Feet Rd', 'Turn left onto 80 Feet Rd']], ['Follow Outer Ring Rd to Hosur Rd', ['Continue onto Outer Ring Rd', ['Keep right to take the flyover', 12.9172, 77.6229], 'Keep right at the fork']]],
  'NH44': [['Take Intermediate Ring Rd to NH 44', ['Turn left onto Intermediate Ring Rd', 'Pass by Domlur flyover']], ['Follow NH 44 to your destination', ['Merge onto NH 44', 'Toll road']]],
  'Old Madras Rd': [['Take Old Madras Rd', ['Turn right onto Old Madras Rd', 'Pass by KR Puram bridge']]] };
function details(i) { const r = shown[i], g = TURNS[r.via] || [[`Follow ${r.via}`, [`Continue on ${r.via}`]]], n = g.flatMap(x => x[1]).length, side = (i - 1) * 0.02; let k = 0;
  const at = t => { if (Array.isArray(t)) return [t[1], t[2]]; const f = ++k / (n + 1); return [from.lat + (to.lat - from.lat) * f, from.lon + (to.lon - from.lon) * f + side]; }; /* routes apart: west, middle, east */
  pane.innerHTML = `<header><button class="det" onclick="draw()">Back</button></header><div class="trip"><div class="dur">${dur(r.min)}</div><h1 class="via">via ${r.via}</h1></div>
    ${g.map(([h, l]) => `<div class="trip"><div>${h}</div><div hidden>${l.map(t => { const [la, lo] = at(t); return `<div data-stepindex data-at="${la.toFixed(5)},${lo.toFixed(5)}">${Array.isArray(t) ? t[0] : t}</div>`; }).join('')}</div></div>`).join('')}`;
  pane.querySelectorAll('[data-stepindex]').forEach(e => e.onclick = () => history.replaceState(null, '', location.pathname + location.search.replace(/&?at=[^&]*/, '') + `&at=@${e.dataset.at},17z`)); }
/* ?search=petrol+pump&at=LAT,LON: Google's search list (role feed; each place a link with its position, rating, hours) */
function search() { const [la, lo] = (q.get('at') || '12.9,77.6').split(',').map(Number), what = q.get('search'), ev = /ev|charg/i.test(what);
  const names = ev ? ['Tata Power EZ Charge', 'Statiq Charging Hub', 'ChargeZone'] : ['Indian Oil', 'HP Petrol Pump', 'Bharat Petroleum', 'Shell'];
  pane.innerHTML = `<div role="feed">${names.map((n, k) => { const d = (k - 1) * 0.004; return `<div class="trip"><a href="https://www.google.com/maps/place/${encodeURIComponent(n)}/data=!3d${(la + d).toFixed(5)}!4d${(lo - d).toFixed(5)}" aria-label="${n}">${n}</a>
    <div class="note">${(4.4 - k * 0.3).toFixed(1)}(${1200 - k * 300}) · ${ev ? 'EV charging station' : 'Petrol pump'}</div><div class="note">${k === 2 ? 'Closed · Opens 6 am' : 'Open 24 hours'}</div></div>`; }).join('')}</div>`; }
q.has('search') ? search() : draw();
</script>
</body>
</html>
