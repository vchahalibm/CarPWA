<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice X</title>
<style>
:root{--bg:#fff;--ink:#0f1419;--ink2:#536471;--line:#eff3f4;--acc:#1d9bf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#e7e9ea;--ink2:#71767b;--line:#2f3336}}
:root[data-theme="dark"]{--bg:#000;--ink:#e7e9ea;--ink2:#71767b;--line:#2f3336}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{display:grid;grid-template-columns:220px minmax(0,600px) 300px;justify-content:center;min-height:100vh}
nav{padding:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
nav a{color:var(--ink);text-decoration:none;font-size:19px;padding:10px 14px;border-radius:999px}nav a[aria-current=page]{font-weight:700}
main{border-right:1px solid var(--line)}
header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;font-weight:800;font-size:20px}
article{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}.av::before{content:attr(data-l)}
.nm b{margin-right:4px}.nm span{color:var(--ink2)}.tx{margin-top:2px;white-space:pre-wrap}.tx .mention{color:var(--acc)}
aside{padding:12px 16px}aside input{width:100%;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--line);color:var(--ink);font:inherit}
.signin{max-width:380px;margin:14vh auto;text-align:center}.signin button{width:100%;height:44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:700 15px system-ui;cursor:pointer}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav,aside{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* A made-up X (Twitter) for practising watchers and tasks (docs/scripts-and-tasks-guide.html). Built like X's web app
   (data-testid: primaryColumn, tweet, User-Name, tweetText, SearchBox_Search_Input) so what's made on it carries over.
   Views: x.html (your timeline), ?user=handle (a profile), ?q=words (live search), ?view=mentions (posts mentioning you).
   ?incoming=@handle|Name|text: a new post arrives (“@you” in it makes it a mention). Sign-in simulated; ?reset starts over. */
const KEY = 'practiceX', q = new URLSearchParams(location.search);
if (q.has('reset')) { localStorage.removeItem(KEY); localStorage.removeItem(KEY + 'Auth'); location.replace(location.pathname); }
const DEF = [
  ['acme', 'Acme Corp', 'We are hiring product designers in Pune and Bengaluru. Apply on our careers page.', '2h'],
  ['priyanair', 'Priya Nair', 'Great workshop with the Acme team today. Thanks @you for the pilot notes!', '3h'],
  ['citytraffic', 'City Traffic', 'Heavy traffic on MG Road near Trinity Circle. Expect 20 minute delays.', '4h'],
  ['rahulm', 'Rahul Mehta', 'Q3 numbers are out: North region up 12 percent.', '6h'],
  ['techdaily', 'Tech Daily', 'New open-weight model release beats last year’s flagship on coding tasks.', '8h'],
].map(([h, n, t, w], i) => ({ id: 'p' + i, h, n, t, w }));
const S = JSON.parse(localStorage.getItem(KEY) || 'null') || structuredClone(DEF), save = () => localStorage.setItem(KEY, JSON.stringify(S));
if (q.get('incoming')) { const [h, n, ...t] = q.get('incoming').split('|'); S.unshift({ id: 'p' + Date.now(), h: h.replace(/^@/, ''), n: n || h, t: t.join('|'), w: 'now' }); save(); q.delete('incoming'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const post = p => `<article data-testid="tweet" role="article" aria-label="${esc(p.n)} @${esc(p.h)}"><span class="av" data-l="${esc(p.n[0])}" aria-hidden="true"></span><div><div class="nm" data-testid="User-Name"><b>${esc(p.n)}</b><span>@${esc(p.h)} · <time datetime="${p.w}">${esc(p.w)}</time></span></div><div class="tx" data-testid="tweetText" lang="en">${esc(p.t).replace(/@you\b/g, '<span class="mention">@you</span>')}</div></div></article>`;
function draw() {
  const user = q.get('user'), words = q.get('q'), mentions = q.get('view') === 'mentions';
  const list = user ? S.filter(p => p.h === user) : words ? S.filter(p => `${p.n} ${p.t}`.toLowerCase().includes(words.toLowerCase())) : mentions ? S.filter(p => /@you\b/.test(p.t)) : S;
  const title = user ? (S.find(p => p.h === user)?.n || '@' + user) : words ? `Search: ${words}` : mentions ? 'Mentions' : 'Home';
  root.innerHTML = `<div class="wrap"><nav aria-label="Primary"><a href="?" ${!user && !words && !mentions ? 'aria-current="page"' : ''} data-testid="AppTabBar_Home_Link">Home</a><a href="?view=mentions" ${mentions ? 'aria-current="page"' : ''} data-testid="AppTabBar_Notifications_Link">Notifications</a></nav>
    <main data-testid="primaryColumn" aria-label="${esc(title)}"><header>${esc(title)}</header><section aria-label="Timeline: ${esc(title)}" role="region"><div aria-label="Timeline" data-testid="cellInnerDiv">${list.map(post).join('') || '<p style="padding:16px">No posts.</p>'}</div></section></main>
    <aside><form id="sf"><input data-testid="SearchBox_Search_Input" aria-label="Search query" placeholder="Search" value="${esc(words || '')}"></form></aside></div>`;
  sf.onsubmit = e => { e.preventDefault(); location.search = '?q=' + encodeURIComponent(sf.querySelector('input').value); };
}
const root = document.getElementById('root');
if (!localStorage.getItem(KEY + 'Auth')) { root.innerHTML = `<div class="signin"><h1>Sign in to X</h1><p>Sign in to continue (practice: nothing is checked)</p><button id="go">Sign in (simulated)</button></div>`; go.onclick = () => { localStorage.setItem(KEY + 'Auth', '1'); location.reload(); }; }
else draw();
</script>
</body>
</html>
