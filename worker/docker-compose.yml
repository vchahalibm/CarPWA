# StudioGen Worker with Docker Compose (worker/README.md), from the repo root:
#   docker compose -f worker/docker-compose.yml up -d --build
services:
  studiogen-worker:
    build: { context: .., dockerfile: worker/Dockerfile }
    container_name: studiogen-worker
    restart: unless-stopped
    shm_size: "1gb"                      # Chromium wants more than Docker's 64 MB
    environment:
      SG_NAME: "My Worker"               # its name in the mesh
      SG_MESH_INVITE: ""                 # an invite for one of your own devices (StudioGen › Mesh › Invite › One of my own devices)
      # The language model: by default your Mac's (StudioGen › Settings › Assistant › Language model), through the mesh.
      # Only to use another one: SG_LLM_PROVIDER "openai" with SG_LLM_URL / SG_LLM_MODEL, or "anthropic" with SG_LLM_KEY.
      SG_SECRET_FILE: /run/secrets/sg_secret
    secrets: [sg_secret]
    volumes: ["studiogen-worker:/data"]
secrets:
  sg_secret: { file: ./sg_secret.txt }   # any long random text: it locks the kept sign-ins (make it once: openssl rand -hex 32 > worker/sg_secret.txt)
volumes:
  studiogen-worker:
